<!DOCTYPE html>
<html lang="en">
<head>
    <title>SAHI Portal - B2B Orders</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; }
        .container { max-width: 1200px; background: white; padding: 30px; margin: auto; border-radius: 8px; }
        .company-header { background: #87CEEB; padding: 12px 20px; margin: -30px -30px 15px -30px; border-radius: 8px 8px 0 0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .company-header .info { color: #000; }
        .company-header .info .l1 { font-weight: bold; font-size: 13px; }
        .company-header .info .l2 { font-size: 11px; }
        .company-header .info .l3 { font-size: 9px; }
        .company-header .logo { background: #fff; border: 1px solid #ddd; border-radius: 4px; padding: 5px 14px; text-align: center; }
        .company-header .logo .l1 { font-weight: bold; font-size: 13px; }
        .company-header .logo .l2 { font-size: 9px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th { background: #87CEEB; color: #000; font-weight: bold; padding: 10px 8px; text-align: left; border: 1px solid #6bc3de; }
        td { padding: 8px; border: 1px solid #ddd; }
        tr:nth-child(even) td { background: #fafafa; }
        tr:hover td { background: #f0f8ff; }
        .btn { display: inline-block; padding: 5px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; text-decoration: none; color: #000; }
        .btn-pdf { background: #FFB7C5; }
        .btn-pdf:hover { background: #ff9aad; }
        .btn-csv { background: #D3D3D3; }
        .btn-csv:hover { background: #c0c0c0; }
        .btn-delete { background: #ff5252; color: #000; }
        .btn-delete:hover { background: #d32f2f; }
        .btn-restore { background: #81c784; color: #000; }
        .btn-restore:hover { background: #4caf50; }
        .btn-disabled { background: #e0e0e0; color: #000; cursor: not-allowed; pointer-events: none; text-decoration: none; }
        .filter-btn { padding: 5px 14px; border: 1px solid #87CEEB; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; background: #fff; color: #000; }
        .filter-btn.active { background: #87CEEB; color: #000; }
        .filter-btn:hover { background: #d4f0f9; }
        .actions { display: flex; gap: 6px; flex-wrap: nowrap; }
        .status-new { background: #e6fffa; color: #000; padding: 2px 8px; border-radius: 3px; font-weight: bold; font-size: 11px; }
        .status-deleted { background: #ffe0e0; color: #000; padding: 2px 8px; border-radius: 3px; font-weight: bold; font-size: 11px; }
        tr.deleted-row td { opacity: 0.55; }
        tr.deleted-row td:first-child strong { text-decoration: line-through; }
        .empty-state { text-align: center; padding: 60px 20px; color: #000; }
        .loading { text-align: center; padding: 40px; color: #000; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="company-header">
            <div class="info">
                <div class="l1">SAHI SHANGHAI COMPANY LTD.</div>
                <div class="l2">飒鹤(上海)贸易有限公司</div>
                <div class="l3">Credit Code: 913100000000000000</div>
            </div>
            <div class="logo">
                <div class="l1">SAHI</div>
                <div class="l2">PORTAL</div>
            </div>
        </div>

        <div class="nav" style="display: flex; gap: 20px; margin-bottom: 20px; border-bottom: 1px solid #ddd; padding-bottom: 10px; align-items: center; flex-wrap: wrap;">
            <a href="/" style="text-decoration: none; color: #000; font-weight: bold;">Sell (Invoice)</a>
            <a href="/create-po.html" style="text-decoration: none; color: #000; font-weight: bold;">Create PO</a>
            <a href="/invoices.html" style="text-decoration: none; color: #000; font-weight: bold;">Invoice to PO</a>
            <a href="/receive-po.html" style="text-decoration: none; color: #000; font-weight: bold;">Receive Stock</a>
            <a href="/items.html" style="text-decoration: none; color: #000; font-weight: bold;">Item Master</a>
            <a href="/transfer.html" style="text-decoration: none; color: #000; font-weight: bold;">Transfer Stock</a>
            <a href="/accounts.html" style="text-decoration: none; color: #000; font-weight: bold;">Accounts</a>
            <a href="/admin-users.html" style="text-decoration: none; color: #000; font-weight: bold;">Manage Users</a>
            <a href="/b2b-orders.html" style="text-decoration: none; color: #000; font-weight: bold;">B2B Orders</a>
        </div>

        <h2 style="margin-bottom: 5px;">B2B Wholesale Orders</h2>
        <p style="color: #000; font-size: 13px; margin-top: 0;">All customer wholesale orders with download options for Shopify</p>

        <div id="filter-bar" style="display: flex; gap: 8px; margin-bottom: 12px; align-items: center;">
            <button class="filter-btn active" onclick="setFilter('all')">All Orders</button>
            <button class="filter-btn" onclick="setFilter('active')">Active</button>
            <button class="filter-btn" onclick="setFilter('deleted')">Deleted</button>
            <span id="filter-count" style="color: #000; font-size: 12px; margin-left: auto;"></span>
        </div>

        <div id="content"></div>
    </div>

    <script>
        const ADMIN_URL = 'https://sahi-mcp.onrender.com';
        let allOrders = [];
        let currentFilter = 'all';

        function setFilter(f) {
            currentFilter = f;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            const labels = { all: 'All Orders', active: 'Active', deleted: 'Deleted' };
            document.querySelectorAll('.filter-btn').forEach(b => {
                if (b.textContent.trim() === labels[f]) b.classList.add('active');
            });
            renderOrders();
        }

        function renderOrders() {
            const content = document.getElementById('content');
            let orders = allOrders;
            if (currentFilter === 'active') orders = allOrders.filter(o => !o.deleted);
            if (currentFilter === 'deleted') orders = allOrders.filter(o => o.deleted);

            const deletedCount = allOrders.filter(o => o.deleted).length;
            const activeCount = allOrders.length - deletedCount;
            const countLabel = document.getElementById('filter-count');
            if (currentFilter === 'deleted') {
                countLabel.textContent = `${orders.length} deleted order(s)`;
            } else if (currentFilter === 'active') {
                countLabel.textContent = `${orders.length} active order(s)`;
            } else {
                countLabel.textContent = `${activeCount} active, ${deletedCount} deleted`;
            }

            if (!orders.length) {
                const msg = currentFilter === 'deleted' ? 'No deleted orders.' : 'No orders found.';
                content.innerHTML = `<div class="empty-state">${msg}</div>`;
                return;
            }

                let html = '<table><thead><tr>';
                html += '<th>Order #</th><th>Date</th><th>Company</th><th>Contact</th><th>Email</th>';
                html += '<th style="text-align:right">Items</th><th style="text-align:right">Subtotal (CAD)</th><th style="text-align:right">HST 13% (CAD)</th><th style="text-align:right">Grand Total (CAD)</th><th>Status</th>';
                html += '<th style="text-align:center">Download</th></tr></thead><tbody>';

                for (const o of orders) {
                    const items = o.items || [];
                    const isDeleted = o.deleted === true;
                    const rowClass = isDeleted ? 'deleted-row' : '';
                    html += `<tr class="${rowClass}">`;
                    html += `<td><strong>#${o.id}</strong></td>`;
                    html += `<td>${o.created_at ? new Date(o.created_at).toLocaleDateString('en-CA') : ''}</td>`;
                    html += `<td>${esc(o.company_name)}</td>`;
                    html += `<td>${esc(o.contact_name)}</td>`;
                    html += `<td style="font-size:12px">${esc(o.email)}</td>`;
                    html += `<td style="text-align:right">${o.item_count || 0}</td>`;
                    html += `<td style="text-align:right">$${Number(o.total_amount || 0).toFixed(2)}</td>`;
                    html += `<td style="text-align:right">$${Number(o.hst_amount || 0).toFixed(2)}</td>`;
                    html += `<td style="text-align:right; font-weight:bold;">$${Number(o.grand_total || 0).toFixed(2)}</td>`;
                    if (isDeleted) {
                        html += `<td><span class="status-deleted">DELETED</span></td>`;
                    } else {
                        html += `<td><span class="status-new">${esc(o.status)}</span></td>`;
                    }
                    html += `<td style="text-align:center"><div class="actions">`;
                    if (isDeleted) {
                        html += `<span class="btn btn-disabled">PDF</span>`;
                        html += `<span class="btn btn-disabled">CSV</span>`;
                        html += `<button class="btn btn-restore" onclick="restoreOrder(${o.id})">Restore</button>`;
                    } else {
                        html += `<a class="btn btn-pdf" href="/api/b2b/admin/orders/${o.id}/pdf" download>PDF</a>`;
                        html += `<a class="btn btn-csv" href="/api/b2b/admin/orders/${o.id}/csv" download>CSV</a>`;
                        html += `<button class="btn btn-delete" onclick="deleteOrder(${o.id})">Delete</button>`;
                    }
                    html += `</div></td></tr>`;
                }

                html += '</tbody></table>';
                content.innerHTML = html;
        }

        async function loadOrders() {
            const content = document.getElementById('content');
            content.innerHTML = '<div class="loading">Loading orders...</div>';
            try {
                const res = await fetch('/api/b2b/admin/orders');
                if (!res.ok) throw new Error('Failed to fetch');
                allOrders = await res.json();
                if (!allOrders.length) {
                    content.innerHTML = '<div class="empty-state">No B2B orders yet. Orders placed by wholesale customers will appear here.</div>';
                    return;
                }
                renderOrders();
            } catch (err) {
                content.innerHTML = `<div class="empty-state">Error loading orders: ${esc(err.message)}</div>`;
            }
        }

        async function deleteOrder(id) {
            if (!confirm(`Delete order #${id}? The order will be marked as deleted but stays visible. PDF/CSV downloads will be disabled.`)) return;
            try {
                const res = await fetch(`/api/b2b/admin/orders/${id}`, { method: 'DELETE' });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.error || 'Failed to delete order');
                }
                loadOrders();
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        async function restoreOrder(id) {
            if (!confirm(`Restore order #${id}?`)) return;
            try {
                const res = await fetch(`/api/b2b/admin/orders/${id}/restore`, { method: 'POST' });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.error || 'Failed to restore order');
                }
                loadOrders();
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        function esc(s) {
            if (!s) return '';
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        // Auth
        const NAV_PERMISSIONS = {
            '/': ['ADMIN'],
            '/create-po.html': ['ADMIN', 'BUYER'],
            '/items.html': ['ADMIN', 'BUYER'],
            '/receive-po.html': ['ADMIN', 'BUYER', 'LOGISTICS'],
            '/transfer.html': ['ADMIN'],
            '/accounts.html': ['ADMIN', 'ACCOUNTS'],
            '/admin-users.html': ['ADMIN'],
            '/b2b-orders.html': ['ADMIN']
        };
        async function initAuthNav() {
            try {
                const res = await fetch('/api/me');
                if (!res.ok) { window.location.href = '/login.html'; return; }
                const me = await res.json();
                document.querySelectorAll('.nav a').forEach(a => {
                    const href = a.getAttribute('href');
                    const allowed = NAV_PERMISSIONS[href];
                    if (allowed && !allowed.includes(me.role)) a.style.display = 'none';
                });
                const nav = document.querySelector('.nav');
                if (nav) {
                    const badge = document.createElement('span');
                    badge.style.marginLeft = 'auto';
                    badge.style.color = '#666';
                    badge.style.fontSize = '13px';
                    badge.innerHTML = `${me.name || me.email} (${me.role}) &nbsp; <a href="#" id="logoutLink" style="color:#d32f2f; text-decoration:none; font-weight:bold;">Logout</a>`;
                    nav.appendChild(badge);
                    document.getElementById('logoutLink').addEventListener('click', async (e) => {
                        e.preventDefault();
                        await fetch('/api/logout', { method: 'POST' });
                        window.location.href = '/login.html';
                    });
                }
            } catch (e) { window.location.href = '/login.html'; }
        }

        initAuthNav();
        loadOrders();
    </script>
</body>
</html>
