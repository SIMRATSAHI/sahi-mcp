<!DOCTYPE html>
<html lang="en">
<head>
    <title>SAHI Portal - B2B Orders</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; }
        .container { max-width: 1200px; background: white; padding: 30px; margin: auto; border-radius: 8px; }
        .company-header { background: #87CEEB; padding: 12px 20px; margin: -30px -30px 15px -30px; border-radius: 8px 8px 0 0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .company-header .info { color: #000; }
        .company-header .info .l1 { font-weight: bold; font-size: 13px; }
        .company-header .info .l2 { font-size: 11px; }
        .company-header .info .l3 { font-size: 9px; }
        .company-header .logo { background: #fff; border: 1px solid #ddd; border-radius: 4px; padding: 5px 14px; text-align: center; }
        .company-header .logo .l1 { font-weight: bold; font-size: 13px; }
        .company-header .logo .l2 { font-size: 9px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th { background: #87CEEB; color: #000; font-weight: bold; padding: 10px 8px; text-align: left; border: 1px solid #6bc3de; }
        td { padding: 8px; border: 1px solid #ddd; }
        tr:nth-child(even) td { background: #fafafa; }
        tr:hover td { background: #f0f8ff; }
        .btn { display: inline-block; padding: 5px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; text-decoration: none; color: #000; }
        .btn-pdf { background: #FFB7C5; }
        .btn-pdf:hover { background: #ff9aad; }
        .btn-csv { background: #D3D3D3; }
        .btn-csv:hover { background: #c0c0c0; }
        .actions { display: flex; gap: 6px; flex-wrap: nowrap; }
        .status-new { background: #e6fffa; color: #00897b; padding: 2px 8px; border-radius: 3px; font-weight: bold; font-size: 11px; }
        .empty-state { text-align: center; padding: 60px 20px; color: #999; }
        .loading { text-align: center; padding: 40px; color: #999; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="company-header">
            <div class="info">
                <div class="l1">SAHI SHANGHAI COMPANY LTD.</div>
                <div class="l2">飒鹤(上海)贸易有限公司</div>
                <div class="l3">Credit Code: 913100000000000000</div>
            </div>
            <div class="logo">
                <div class="l1">SAHI</div>
                <div class="l2">PORTAL</div>
            </div>
        </div>

        <div class="nav" style="display: flex; gap: 20px; margin-bottom: 20px; border-bottom: 1px solid #ddd; padding-bottom: 10px; align-items: center; flex-wrap: wrap;">
            <a href="/" style="text-decoration: none; color: #87CEEB; font-weight: bold;">Sell (Invoice)</a>
            <a href="/create-po.html" style="text-decoration: none; color: #87CEEB; font-weight: bold;">Create PO</a>
            <a href="/invoices.html" style="text-decoration: none; color: #87CEEB; font-weight: bold;">Invoice to PO</a>
            <a href="/receive-po.html" style="text-decoration: none; color: #87CEEB; font-weight: bold;">Receive Stock</a>
            <a href="/items.html" style="text-decoration: none; color: #87CEEB; font-weight: bold;">Item Master</a>
            <a href="/transfer.html" style="text-decoration: none; color: #87CEEB; font-weight: bold;">Transfer Stock</a>
            <a href="/accounts.html" style="text-decoration: none; color: #87CEEB; font-weight: bold;">Accounts</a>
            <a href="/admin-users.html" style="text-decoration: none; color: #87CEEB; font-weight: bold;">Manage Users</a>
            <a href="/b2b-orders.html" style="text-decoration: none; color: #000; font-weight: bold;">B2B Orders</a>
        </div>

        <h2 style="margin-bottom: 5px;">B2B Wholesale Orders</h2>
        <p style="color: #888; font-size: 13px; margin-top: 0;">All customer wholesale orders with download options for Shopify</p>

        <div id="content"></div>
    </div>

    <script>
        const ADMIN_URL = 'https://sahi-mcp.onrender.com';

        async function loadOrders() {
            const content = document.getElementById('content');
            content.innerHTML = '<div class="loading">Loading orders...</div>';

            try {
                const res = await fetch('/api/b2b/admin/orders');
                if (!res.ok) throw new Error('Failed to fetch');
                const orders = await res.json();

                if (!orders.length) {
                    content.innerHTML = '<div class="empty-state">No B2B orders yet. Orders placed by wholesale customers will appear here.</div>';
                    return;
                }

                let html = '<table><thead><tr>';
                html += '<th>Order #</th><th>Date</th><th>Company</th><th>Contact</th><th>Email</th>';
                html += '<th style="text-align:right">Items</th><th style="text-align:right">Subtotal (CAD)</th><th style="text-align:right">HST 13% (CAD)</th><th style="text-align:right">Grand Total (CAD)</th><th>Status</th>';
                html += '<th style="text-align:center">Download</th></tr></thead><tbody>';

                for (const o of orders) {
                    const items = o.items || [];
                    html += '<tr>';
                    html += `<td><strong>#${o.id}</strong></td>`;
                    html += `<td>${o.created_at ? new Date(o.created_at).toLocaleDateString('en-CA') : ''}</td>`;
                    html += `<td>${esc(o.company_name)}</td>`;
                    html += `<td>${esc(o.contact_name)}</td>`;
                    html += `<td style="font-size:12px">${esc(o.email)}</td>`;
                    html += `<td style="text-align:right">${o.item_count || 0}</td>`;
                    html += `<td style="text-align:right">$${Number(o.total_amount || 0).toFixed(2)}</td>`;
                    html += `<td style="text-align:right">$${Number(o.hst_amount || 0).toFixed(2)}</td>`;
                    html += `<td style="text-align:right; font-weight:bold;">$${Number(o.grand_total || 0).toFixed(2)}</td>`;
                    html += `<td><span class="status-new">${esc(o.status)}</span></td>`;
                    html += `<td style="text-align:center"><div class="actions">`;
                    html += `<a class="btn btn-pdf" href="/api/b2b/admin/orders/${o.id}/pdf" download>PDF</a>`;
                    html += `<a class="btn btn-csv" href="/api/b2b/admin/orders/${o.id}/csv" download>CSV</a>`;
                    html += `</div></td></tr>`;
                }

                html += '</tbody></table>';
                content.innerHTML = html;
            } catch (err) {
                content.innerHTML = `<div class="empty-state">Error loading orders: ${esc(err.message)}</div>`;
            }
        }

        function esc(s) {
            if (!s) return '';
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        // Auth
        const NAV_PERMISSIONS = {
            '/': ['ADMIN'],
            '/create-po.html': ['ADMIN', 'BUYER'],
            '/items.html': ['ADMIN', 'BUYER'],
            '/receive-po.html': ['ADMIN', 'BUYER', 'LOGISTICS'],
            '/transfer.html': ['ADMIN'],
            '/accounts.html': ['ADMIN', 'ACCOUNTS'],
            '/admin-users.html': ['ADMIN'],
            '/b2b-orders.html': ['ADMIN']
        };
        async function initAuthNav() {
            try {
                const res = await fetch('/api/me');
                if (!res.ok) { window.location.href = '/login.html'; return; }
                const me = await res.json();
                document.querySelectorAll('.nav a').forEach(a => {
                    const href = a.getAttribute('href');
                    const allowed = NAV_PERMISSIONS[href];
                    if (allowed && !allowed.includes(me.role)) a.style.display = 'none';
                });
                const nav = document.querySelector('.nav');
                if (nav) {
                    const badge = document.createElement('span');
                    badge.style.marginLeft = 'auto';
                    badge.style.color = '#666';
                    badge.style.fontSize = '13px';
                    badge.innerHTML = `${me.name || me.email} (${me.role}) &nbsp; <a href="#" id="logoutLink" style="color:#d32f2f; text-decoration:none; font-weight:bold;">Logout</a>`;
                    nav.appendChild(badge);
                    document.getElementById('logoutLink').addEventListener('click', async (e) => {
                        e.preventDefault();
                        await fetch('/api/logout', { method: 'POST' });
                        window.location.href = '/login.html';
                    });
                }
            } catch (e) { window.location.href = '/login.html'; }
        }

        initAuthNav();
        loadOrders();
    </script>
</body>
</html>
